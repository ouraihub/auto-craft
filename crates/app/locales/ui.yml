      "en": "Export & preview"
    "more":
      "zh-CN": "加载更多"
      "en": "Load more"
    "consent":
      "zh-CN": "仅可提取自己制作或已获权利人许可的游戏内容。允许本次读取并向所选位置写入文件？不会覆盖已有文件。"
      "en": "Extract only games you made or have the rights holder's permission to unpack. Allow this read and write to the selected destination? Existing files will not be overwritten."
    "allow":
      "zh-CN": "我有权限，允许本次"
      "en": "I have permission; allow once"
    "loading":
      "zh-CN": "正在处理…"
      "en": "Working…"
    "saved":
      "zh-CN": "已保存，%{width} × %{height}"
      "en": "Saved, %{width} × %{height}"
    "failed":
      "zh-CN": "操作失败。请检查文件是否可读取、输出是否已存在，或调整选择后重试。"
      "en": "Operation failed. Check that the source is readable and the output does not already exist, or change the selection and retry."
    "unavailable":
      "zh-CN": "此工具在当前目标或系统上不可用。请检查目标和分析设置。"
      "en": "This tool is unavailable for the current target or system. Check the target and analysis settings."
    "unsupported":
      "zh-CN": "不支持此归档的读取方式，请选择支持的游戏归档。"
      "en": "This archive's listing method is unsupported. Choose a supported game archive."
    "invalid_result":
      "zh-CN": "分析工具返回了无法识别的结果。"
      "en": "The analysis tool returned an unrecognized result."
    "picker_failed":
      "zh-CN": "无法打开文件选择器，请重试。"
      "en": "The file picker could not be opened. Try again."
    "output_exists":
      "zh-CN": "所选 PNG 文件已存在，不会覆盖。请重新导出并选择其他文件名。"
      "en": "The PNG file already exists and will not be overwritten. Export again with a different file name."
